name: Wheel size validation (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, ubuntu-22.04-arm]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    env:
      VERSION: 1.0.0.dev0
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3.0'

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libncurses-dev libtinfo6 libzstd-dev libffi-dev zlib1g-dev libxml2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release SDK
        run: |
          npm install svf-lib@1.0.2782
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            echo "SVF_DIR=$PWD/node_modules/svf-lib/SVF-linux-$(uname -m)" >> "$GITHUB_ENV"
          else
            echo "SVF_DIR=$PWD/node_modules/svf-lib/SVF-osx" >> "$GITHUB_ENV"
          fi
          echo "LLVM_DIR=$PWD/node_modules/llvm-21.1.0.obj" >> "$GITHUB_ENV"
          echo "Z3_DIR=$PWD/node_modules/z3.obj" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: python -m pip install build wheel setuptools pybind11

      - name: Build release wheel
        run: |
          export PYBIND11_DIR=$(python -m pybind11 --cmakedir)
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            python setup.py bdist_wheel --plat-name macosx-11.0-arm64
          else
            python setup.py bdist_wheel --plat-name "manylinux2014_$(uname -m)"
          fi

      - name: Check wheel size and contents
        run: |
          python - <<'PY'
          import json
          import platform
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          size = wheel.stat().st_size
          with ZipFile(wheel) as archive:
              llvm_files = [name for name in archive.namelist() if Path(name).name.startswith('libLLVM.')]
          result = dict(platform=platform.system(), arch=platform.machine(),
                        python=platform.python_version(), wheel=wheel.name,
                        bytes=size, mib=size / 1024**2, limit_bytes=100 * 1024**2,
                        standalone_llvm=llvm_files)
          Path('wheel-size.json').write_text(json.dumps(result, indent=2) + '\n')
          print('SIZE_RESULT=' + json.dumps(result))
          assert not llvm_files, llvm_files
          assert size < 100 * 1024**2, f'{wheel.name}: {size / 1024**2:.3f} MiB exceeds the limit'
          PY

      - name: Install and test wheel
        working-directory: ${{ runner.temp }}
        env:
          WHEEL_DIR: ${{ github.workspace }}/dist
          BITCODE_PATH: ${{ github.workspace }}/test_cases/BASIC_array_2d_0-0.c.bc
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install "$WHEEL_DIR"/*.whl
          "$RUNNER_TEMP/wheel-test/bin/python" -I - <<'PY'
          import os
          import sys
          import pysvf

          assert sys.version_info[:2] == tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.')))
          print('Python:', sys.version)
          print('Installed package:', pysvf.__file__)
          svfir = pysvf.get_svfir(os.environ['BITCODE_PATH'])
          assert svfir is not None
          nodes = svfir.getICFG().getNodes()
          assert nodes
          print('ICFG nodes:', len(nodes))
          pysvf.releasePAG()
          PY

      - name: Save size measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-size-${{ matrix.os }}-py${{ matrix.python-version }}
          path: wheel-size.json
          if-no-files-found: ignore
