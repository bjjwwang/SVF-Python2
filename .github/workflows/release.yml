name: Python 3.14 release validation (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            python-version: '3.14'
            wheel-platform: linux
    env:
      VERSION: 1.0.0.dev0
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nodejs doxygen graphviz lcov libncurses-dev libtinfo6 libzstd-dev python3 python3-pip python3-venv patchelf

      - name: Install release SDK
        run: |
          npm install svf-lib@1.0.2782
          echo "SVF_DIR=$PWD/node_modules/svf-lib/SVF-linux-$(uname -m)" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$PWD/node_modules/llvm-21.1.0.obj" >> "$GITHUB_ENV"
          echo "Z3_DIR=$PWD/node_modules/z3.obj" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install release Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine pybind11 auditwheel setuptools

      - name: Build release wheel
        run: |
          export PYBIND11_DIR=$(python -m pybind11 --cmakedir)
          python setup.py bdist_wheel --plat-name "${{ matrix.wheel-platform || 'manylinux2014' }}_$(uname -m)"

      - name: Check wheel size and contents
        run: |
          python - <<'PY'
          import json
          import platform
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('dist').glob('*cp314-cp314-linux_x86_64.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          size = wheel.stat().st_size
          with ZipFile(wheel) as archive:
              llvm_files = [name for name in archive.namelist() if Path(name).name.startswith('libLLVM.')]
          result = dict(platform=platform.system(), arch=platform.machine(),
                        python=platform.python_version(), wheel=wheel.name,
                        bytes=size, mib=size / 1024**2, limit_bytes=100 * 1024**2,
                        standalone_llvm=llvm_files)
          Path('wheel-size.json').write_text(json.dumps(result, indent=2) + '\n')
          print('SIZE_RESULT=' + json.dumps(result))
          assert not llvm_files
          assert size < 100 * 1024**2, result
          PY

      - name: Install and test wheel
        working-directory: ${{ runner.temp }}
        env:
          WHEEL_DIR: ${{ github.workspace }}/dist
          BITCODE_PATH: ${{ github.workspace }}/test_cases/BASIC_array_2d_0-0.c.bc
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install "$WHEEL_DIR"/*.whl
          "$RUNNER_TEMP/wheel-test/bin/python" -I - <<'PY'
          import os
          import sys
          import pysvf

          assert sys.version_info[:2] == (3, 14)
          print('Python:', sys.version)
          print('Installed package:', pysvf.__file__)
          svfir = pysvf.get_svfir(os.environ['BITCODE_PATH'])
          assert svfir is not None
          nodes = svfir.getICFG().getNodes()
          assert nodes
          print('ICFG nodes:', len(nodes))
          pysvf.releasePAG()
          PY

      - name: Save size measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-size-ubuntu2604-py314
          path: wheel-size.json
          if-no-files-found: ignore
